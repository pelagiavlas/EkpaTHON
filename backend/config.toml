# Κανόνες για τα επίπεδα υποστήριξης. Ισχύουν ΑΝΑ ΕΝΟΤΗΤΑ.
# Είναι απλοί και διαφανείς: αλλάξτε τα νούμερα εδώ, όχι στον κώδικα.
# Οι κανόνες μόνο ΠΡΟΤΕΙΝΟΥΝ αλλαγή. Αποφασίζει πάντα ο φοιτητής.

[fading]
# Πρόταση για ΛΙΓΟΤΕΡΗ βοήθεια: τόσες επιτυχίες στη σειρά στην ίδια ενότητα.
up_after_successes = 3
# Επίπεδα 1-2: επιτυχία = σωστή με την πρώτη, με το πολύ τόσες υποδείξεις.
success_max_hints = 1

# Πρόταση για ΠΕΡΙΣΣΟΤΕΡΗ βοήθεια: στις τελευταίες `down_window` απαντήσεις...
down_window = 3
# ...τουλάχιστον τόσες ήταν δύσκολες.
down_struggles = 2
# Επίπεδα 1-2: από τόσες υποδείξεις και πάνω, η απάντηση μετράει ως δύσκολη.
# Επίπεδα 3-4: δύσκολη = λάθος απάντηση ή επιστροφή στις υποδείξεις που εξηγούν.
# Το ψάξιμο στο πρωτότυπο (α, β, γ) ΔΕΝ μετράει ως δυσκολία.
struggle_min_hints = 3

# Επίπεδα 3-4: αν ο φοιτητής ανοίξει το Εύκολο κείμενο σε τόσες...
easy_down = 2
# ...από τις τελευταίες τόσες φορές που διάβασε την ενότητα, προτείνουμε ένα επίπεδο πίσω.
easy_window = 3

[search]
# Επίπεδα 3-4: μετά από τόσες λάθος προτάσεις, πάμε στις υποδείξεις που εξηγούν.
max_wrong_picks = 3

[engine]
# Ποιοι κανόνες αποφασίζουν τις προτάσεις για λιγότερη/περισσότερη υποστήριξη:
# "bkt"   = εκτίμηση γνώσης ανά έννοια (Bayesian Knowledge Tracing, ενότητα [bkt])
# "rules" = οι απλοί κανόνες της ενότητας [fading] (εφεδρικοί)
fading = "bkt"

[bkt]
# Πιθανότητα να ξέρει ήδη μια έννοια που δεν έχει συναντήσει.
p_init = 0.3
# Πιθανότητα να τη μάθει σε κάθε προσπάθεια.
p_learn = 0.15
# Πιθανότητα να κάνει λάθος ενώ την ξέρει (απροσεξία).
p_slip = 0.1
# Πιθανότητα να απαντήσει σωστά στην τύχη, ανάλογα με το είδος της ερώτησης.
p_guess_two_choices = 0.5
p_guess_three_choices = 0.33
p_guess_open = 0.05
# Ως «σωστό» για τη γνώση μετρά μόνο σωστή απάντηση με την πρώτη και το πολύ τόσες βοήθειες.
known_max_help = 1
# Πρόταση για λιγότερη υποστήριξη: ΟΛΕΣ οι έννοιες της ενότητας πάνω από αυτό.
up_threshold = 0.90
# Πρόταση για περισσότερη: η έννοια που δουλεύει τώρα κάτω από αυτό...
down_threshold = 0.40
# ...και μόνο αφού έχει τουλάχιστον τόσες απαντήσεις σε αυτή την έννοια.
min_observations = 2
# Τι βλέπει ο φοιτητής (ποτέ ποσοστά): κάτω από almost = «Το μαθαίνεις»,
# από almost μέχρι known = «Σχεδόν το ξέρεις», από known και πάνω = «Το ξέρεις».
label_almost = 0.60
label_known = 0.90
