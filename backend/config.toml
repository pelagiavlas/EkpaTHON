# Κανόνες για τα επίπεδα υποστήριξης και την πρόβλεψη.
# Είναι απλοί και διαφανείς: αλλάξτε τα νούμερα εδώ, όχι στον κώδικα.

[fading]
# Πρόταση για ΛΙΓΟΤΕΡΗ βοήθεια: τόσες σωστές απαντήσεις στη σειρά...
up_after_successes = 3
# ...με το πολύ τόσες υποδείξεις η καθεμία (και σωστές με την πρώτη).
success_max_hints = 1

# Πρόταση για ΠΕΡΙΣΣΟΤΕΡΗ βοήθεια: στις τελευταίες `down_window` ερωτήσεις...
down_window = 3
# ...τουλάχιστον τόσες ήταν δύσκολες (λάθος ή με πολλές υποδείξεις).
down_struggles = 2
# Από τόσες υποδείξεις και πάνω, μια ερώτηση μετράει ως δύσκολη.
struggle_min_hints = 3

[prediction]
# Κάθε παλιότερο κεφάλαιο μετράει τόσο λιγότερο (0.5 = το μισό).
recency_decay = 0.5
# Πόσο βαραίνουν τα λάθη σε σχέση με τις υποδείξεις.
wrong_weight = 2.0
# Βαθμός = υποδείξεις ανά ερώτηση + wrong_weight × ποσοστό λαθών.
# Κάτω από το 1ο όριο → επίπεδο 4, κάτω από το 2ο → 3, κάτω από το 3ο → 2, αλλιώς 1.
thresholds = [0.75, 1.5, 2.5]
# Η πρόταση για νέο κεφάλαιο ανεβαίνει το πολύ τόσα επίπεδα πάνω από το τωρινό.
max_step_up = 1
